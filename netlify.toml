# Netlify serves only the standalone Sales & Commission Tracker (static, no build).
[build]
  base = "sales-tracker"
  publish = "."
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
